[package]
name = "md-boss"
version = "0.1.0"
description = "A markdown viewer and editor that looks like paper"
authors = ["dux"]
repository = "https://github.com/dux/md-boss"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
memchr = "2"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
