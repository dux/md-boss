# Release pipeline. Tag `vX.Y.Z` (matching package.json) and this builds every platform
# and publishes the assets the install scripts pull from.
#
# The build steps themselves live in the Hammerfile, not here - this installs the gem and
# calls the same `hammer` tasks you run locally, so there is one description of how the app
# is assembled rather than two that drift apart.
#
# The frontend is built once and shared: dist/ must be the same bytes in every platform
# bundle, and the payload tarball an in-app update replaces is platform independent.
#
# The macOS jobs sign with a Developer ID and notarize, so Finder will open a *downloaded*
# document with the app - an ad-hoc build is refused there. Six repository secrets drive it;
# without them the macOS build falls back to ad-hoc and everything else still works:
#
#   APPLE_CERTIFICATE            Developer ID Application cert (.p12), base64
#   APPLE_CERTIFICATE_PASSWORD   the .p12's password
#   KEYCHAIN_PASSWORD            any throwaway string for the temporary keychain
#   APPLE_API_KEY_P8             App Store Connect API private key (.p8), file contents
#   APPLE_API_KEY_ID             that key's Key ID
#   APPLE_API_ISSUER             the API issuer UUID (App Store Connect > Integrations)

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  HAMMER_VERSION: '~> 0.3'

jobs:
  frontend:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: gem install lux-hammer -v "$HAMMER_VERSION"

      - id: meta
        name: Version from package.json, checked against the tag
        run: |
          version=$(ruby -rjson -e 'puts JSON.parse(File.read("package.json"))["version"]')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Not `hammer install` - that also runs cargo fetch, and there is no Rust on this job.
      - run: bun install --frozen-lockfile

      # `hammer icon` skips quietly without this, and the macOS bundle would ship iconless.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - run: hammer frontend

      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: icons, path: icons/icon_*.png, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: asset-payload, path: payload-*.tar.gz, retention-days: 1 }

  shell:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64   }
          - { os: ubuntu-22.04,   target: linux-x64    }
          - { os: windows-2022,   target: windows-x64  }
    runs-on: ${{ matrix.os }}
    # macOS jobs sign with the Developer ID and notarize. All of these may be absent, in
    # which case `hammer package` falls back to an ad-hoc signature and the app still runs
    # - only Finder's "Open With" on a downloaded document needs the notarized build.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: shell }
      - run: gem install lux-hammer -v "${{ env.HAMMER_VERSION }}"

      # Built on the oldest supported runner so the glibc floor stays low.
      - name: WebKitGTK and the drop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev pkg-config

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: icons, path: icons }

      # Every platform lints and tests its own half: this is where a Windows-only clippy
      # failure surfaces, rather than in the bundle someone downloads.
      - run: hammer lint
      - run: hammer test

      # A Developer ID Application certificate exported to .p12, base64'd, in a temporary
      # keychain. `KEYCHAIN_PASSWORD` can be any throwaway string.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/mdboss.keychain"
          echo "$APPLE_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # The App Store Connect API private key (.p8), written where notarytool can read it.
      - name: Write the notarization key
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - run: hammer package --release
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # The only machine in the pipeline that can parse it, so it is checked here rather
      # than shipped untested to whoever runs the install line first.
      - name: Parse-check install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'install.ps1 parses'

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: |
            md-boss-*.tar.gz
            md-boss-*.zip
          retention-days: 1

  release:
    needs: [frontend, shell]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: asset-*, path: assets, merge-multiple: true }

      # One SHA256SUMS rather than a .sha256 per asset: the install scripts fetch it once
      # and read their own line out of it.
      - name: SHA256SUMS
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS

      - name: Publish
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.frontend.outputs.version) }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber \
            || gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" \
                 --title "md-boss $TAG" --generate-notes
