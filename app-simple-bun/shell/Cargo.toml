[package]
name = "md-boss"
version = "0.1.0"
edition = "2021"
description = "md-boss shell: one window with the platform webview, a local bun behind it"
publish = false

[[bin]]
name = "md-boss"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.56"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
muda = "0.19"
rfd = "0.17"
arboard = "3"
open = "5"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
